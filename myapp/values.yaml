replicaCount: 2
image:
  repository: nginx
  tag: "1.27"
  pullPolicy: IfNotPresent
app:
  environment: demo
  greeting: "Hello from Helm"
probes:
  path: /
service:
  type: ClusterIP
  port: 80
  targetPort: 80
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
